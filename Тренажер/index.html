<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Тренажёр: Физика 7 класс</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
:root {
  --bg: #f0f4f8; --card: #ffffff; --primary: #3b82f6; --primary-light: #dbeafe;
  --green: #22c55e; --red: #ef4444; --yellow: #eab308;
  --text: #1e293b; --text-secondary: #64748b; --border: #e2e8f0;
  --shadow: 0 2px 12px rgba(0,0,0,0.08); --radius: 14px;
}
[data-theme="dark"] {
  --bg: #0f172a; --card: #1e293b; --primary: #60a5fa; --primary-light: #1e3a5f;
  --green: #4ade80; --red: #f87171; --yellow: #facc15;
  --text: #f1f5f9; --text-secondary: #94a3b8; --border: #334155;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden}
.header{background:linear-gradient(135deg,var(--primary),#6366f1);color:#fff;padding:20px 16px 16px;text-align:center;position:sticky;top:0;z-index:10}
.header h1{font-size:1.5rem;font-weight:800}
.header .subtitle{font-size:.85rem;opacity:.85;margin-top:2px}
.theme-btn{position:absolute;top:14px;right:12px;background:rgba(255,255,255,.2);border:none;color:#fff;font-size:1.3rem;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hw-btn{position:relative;top:auto;right:auto;display:flex;align-items:center;justify-content:center;gap:8px;margin:14px auto 0;width:fit-content;background:linear-gradient(135deg,#f59e0b,#f97316);border:3px solid rgba(255,255,255,.85);color:#fff;font-size:.95rem;font-weight:800;padding:12px 28px;border-radius:30px;cursor:pointer;font-family:inherit;box-shadow:0 4px 18px rgba(249,115,22,.5);transition:all .2s}
.hw-btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 6px 24px rgba(249,115,22,.6);border-color:#fff}
.hw-btn:active{transform:scale(.97)}
.hw-btn{animation:hwPulse 2.2s ease-in-out infinite}
@keyframes hwPulse{0%,100%{box-shadow:0 4px 18px rgba(249,115,22,.5)}50%{box-shadow:0 4px 26px rgba(249,115,22,.85);transform:translateY(-2px)}}
.container{padding:12px;max-width:480px;margin:0 auto}
.nav-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.nav-btn{display:flex;align-items:center;gap:6px;padding:10px 16px;background:var(--card);border:2px solid var(--border);border-radius:10px;font-family:inherit;font-weight:700;font-size:.9rem;color:var(--text);cursor:pointer;box-shadow:var(--shadow);transition:all .2s}
.nav-btn:active{transform:scale(.96)}
.nav-title{flex:1;font-weight:700;font-size:1rem;text-align:center;color:var(--text-secondary)}
.screen{display:none;animation:fadeIn .3s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.menu{display:grid;grid-template-columns:1fr;gap:8px}
.menu-group{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border:2px solid var(--border)}
.menu-group-header{display:flex;align-items:center;gap:10px;padding:16px 14px;cursor:pointer;transition:background .2s}
.menu-group-header:active{background:var(--bg)}
.gh-icon{font-size:1.6rem}
.gh-label{flex:1;font-size:1rem;font-weight:700}
.gh-arrow{font-size:1.3rem;transition:transform .3s;color:var(--text-secondary)}
.menu-group.open .gh-arrow{transform:rotate(90deg)}
.menu-group-items{display:none;padding:0 8px 8px 8px}
.menu-group.open .menu-group-items{display:block}
.menu-item{display:flex;justify-content:space-between;align-items:center;padding:12px 12px;margin:2px 0;border-radius:8px;cursor:pointer;transition:background .15s;border:1px solid transparent}
.menu-item:active{background:var(--bg);border-color:var(--border)}
.mi-label{font-size:.88rem;font-weight:600}
.mi-count{font-size:.72rem;color:var(--text-secondary)}
.stats-row{display:flex;gap:8px;margin-bottom:12px}
.stat-box{flex:1;background:var(--card);border-radius:var(--radius);padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
.stat-box .stat-val{font-size:1.6rem;font-weight:800}
.stat-box .stat-label{font-size:.7rem;color:var(--text-secondary);font-weight:600;margin-top:2px}
.stat-box.green .stat-val{color:var(--green)}
.stat-box.red .stat-val{color:var(--red)}
.progress-wrap{background:var(--border);border-radius:20px;height:28px;overflow:hidden;margin-bottom:12px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),#34d399);border-radius:20px;transition:width .4s ease;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.75rem;min-width:40px}
.ex-card{background:var(--card);border-radius:var(--radius);padding:20px 16px;box-shadow:var(--shadow);margin-bottom:12px;text-align:center}
.ex-label{font-size:.85rem;color:var(--text-secondary);font-weight:600;margin-bottom:4px}
.ex-progress{font-size:.8rem;color:var(--text-secondary);margin-bottom:12px}
.ex-task{font-size:1.7rem;font-weight:800;margin-bottom:20px;letter-spacing:1px;line-height:1.4}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.opt-btn{padding:16px 10px;border:2px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-family:inherit;font-size:1.1rem;font-weight:700;cursor:pointer;transition:all .15s;text-align:center}
.opt-btn:active{transform:scale(.96)}
.opt-btn:hover{border-color:var(--primary);background:var(--primary-light)}
.opt-btn.selected{border-color:var(--primary);background:var(--primary);color:#fff}
.opt-btn.correct{border-color:var(--green);background:var(--green);color:#fff}
.opt-btn.wrong{border-color:var(--red);background:var(--red);color:#fff}
.opt-btn:disabled{cursor:default;opacity:1}
.feedback{margin-top:12px;padding:12px;border-radius:8px;font-weight:700;font-size:.95rem;display:none}
.feedback.show{display:block;animation:fadeIn .3s ease}
.feedback.ok{background:#dcfce7;color:#166534}
.feedback.fail{background:#fee2e2;color:#991b1b}
[data-theme="dark"] .feedback.ok{background:#14532d;color:#bbf7d0}
[data-theme="dark"] .feedback.fail{background:#7f1d1d;color:#fecaca}
.timer{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;padding:6px 16px;border-radius:20px;background:var(--primary-light);color:var(--primary);font-size:.95rem;font-weight:800;min-width:110px;justify-content:center;transition:all .2s}
.timer.low{background:#fee2e2;color:#ef4444;animation:timerBlink .5s step-start infinite}
@keyframes timerBlink{50%{opacity:.55}}
.result-card{background:var(--card);border-radius:var(--radius);padding:28px 16px;box-shadow:var(--shadow);text-align:center}
.result-card h2{font-size:1.4rem;margin-bottom:12px}
.result-big{font-size:3rem;font-weight:800;margin:12px 0}
.result-big.green{color:var(--green)}.result-big.yellow{color:var(--yellow)}.result-big.red{color:var(--red)}
.result-msg{font-size:1rem;color:var(--text-secondary);margin-bottom:20px}
.btn-back{padding:14px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer;width:100%}
.btn-back:active{transform:scale(.97)}
.confetti-box{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;overflow:hidden}
.confetti-p{position:absolute;top:-12px;animation:cFall linear forwards}
@keyframes cFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100dvh) rotate(720deg);opacity:0}}
.reg-card{background:var(--card);border-radius:var(--radius);padding:28px 20px;box-shadow:var(--shadow);text-align:center;margin-top:40px}
.reg-card h2{font-size:1.4rem;margin-bottom:6px}
.reg-card .reg-sub{font-size:.85rem;color:var(--text-secondary);margin-bottom:20px}
.reg-field{margin-bottom:14px;text-align:left}
.reg-field label{display:block;font-size:.85rem;font-weight:700;color:var(--text-secondary);margin-bottom:4px}
.reg-field input{width:100%;padding:12px;border:2px solid var(--border);border-radius:10px;font-family:inherit;font-size:1rem;background:var(--bg);color:var(--text);outline:none;transition:border .2s}
.reg-field input:focus{border-color:var(--primary)}
.reg-btn{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer;margin-top:6px}
.reg-btn:active{transform:scale(.97)}
.user-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border-radius:20px;padding:4px 12px 4px 8px;font-size:.8rem;font-weight:700;position:absolute;top:14px;left:12px;cursor:pointer}
.user-badge:active{background:rgba(255,255,255,.35)}
.game-card{background:var(--card);border-radius:var(--radius);padding:20px 16px;box-shadow:var(--shadow);margin-bottom:12px;text-align:center}
.game-card h3{font-size:1.2rem;font-weight:800;margin-bottom:8px;color:var(--primary)}
.game-card p{font-size:.85rem;color:var(--text-secondary);margin-bottom:14px}
.game-pick{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.game-pick button{padding:10px 18px;border:2px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-family:inherit;font-weight:700;font-size:.9rem;cursor:pointer;transition:all .15s}
.game-pick button:active{transform:scale(.96)}
.game-pick button.correct{border-color:var(--green);background:var(--green);color:#fff}
.game-pick button.wrong{border-color:var(--red);background:var(--red);color:#fff}
.game-pick button:disabled{cursor:default;opacity:1}
.truth-btns{display:flex;gap:12px;justify-content:center;margin-top:10px}
.truth-btns button{padding:14px 28px;border:2px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer;transition:all .15s}
.truth-btns button:active{transform:scale(.96)}
.truth-btns button.correct{border-color:var(--green);background:var(--green);color:#fff}
.truth-btns button.wrong{border-color:var(--red);background:var(--red);color:#fff}
.truth-btns button:disabled{cursor:default;opacity:1}
.odd-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.odd-card{padding:14px;border:2px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-family:inherit;font-weight:700;font-size:.95rem;cursor:pointer;transition:all .15s;text-align:center}
.odd-card:active{transform:scale(.96)}
.odd-card.correct{border-color:var(--green);background:var(--green);color:#fff}
.odd-card.wrong{border-color:var(--red);background:var(--red);color:#fff}
.odd-card.odd-out{border-color:var(--yellow);background:var(--yellow);color:#fff}
.odd-card:disabled{cursor:default;opacity:1}
.topic-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 16px;cursor:pointer;transition:all .2s;border:2px solid var(--border)}
.topic-card:active{transform:scale(.97);border-color:var(--primary)}
.topic-card .tc-icon{font-size:2.2rem;margin-bottom:6px}
.topic-card .tc-title{font-size:1.05rem;font-weight:800;color:var(--text);margin-bottom:4px}
.topic-card .tc-desc{font-size:.8rem;color:var(--text-secondary);line-height:1.4}
.homework-content{display:flex;flex-direction:column;gap:10px}
.hw-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 14px;border:2px solid var(--border)}
.hw-card h3{font-size:1rem;font-weight:800;margin-bottom:8px;color:var(--primary)}
.hw-card .hw-title{font-size:1.15rem;font-weight:800;margin-bottom:10px}
.hw-card .hw-sub{font-size:.88rem;color:var(--text-secondary);line-height:1.5;margin-bottom:10px}
.hw-card ul{margin:0 0 10px 18px}
.hw-card ul li{font-size:.88rem;line-height:1.6}
.hw-card .hw-formula{background:var(--primary-light);border-radius:8px;padding:10px 12px;font-weight:800;text-align:center;margin:8px 0;font-size:.95rem}
.hw-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.82rem}
.hw-table th,.hw-table td{border:1px solid var(--border);padding:6px 8px;text-align:center}
.hw-table th{background:var(--primary-light);font-weight:800}
.hw-answer-box{display:none;background:var(--primary-light);border-radius:8px;padding:12px;margin-top:8px;font-size:.85rem;line-height:1.6}
.hw-answer-box.show{display:block}
.hw-answer-box strong{color:var(--primary)}
.hw-show-btn{width:100%;padding:10px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-family:inherit;font-weight:700;font-size:.9rem;cursor:pointer;margin-top:8px}
.hw-show-btn:active{transform:scale(.97)}
@media(max-width:480px){
  body,.container{padding:10px!important}
  .header{padding:12px!important}
  .opt-btn{padding:12px 10px!important;font-size:1rem!important}
  .odd-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="header">
  <h1>⚛️ Физика 7 класс</h1>
  <div class="subtitle">Тренажёр для 7 класса</div>
  <button class="theme-btn" onclick="toggleTheme()">🌙</button>
  <button class="hw-btn" onclick="openHWList()">📚 Домашнее задание</button>
</div>

<div class="container">
  <!-- ВЫБОР ТЕМЫ -->
  <div class="screen" id="screenTopics">
    <div class="stats-row" id="topicStats"></div>
    <div class="menu" id="topicGrid"></div>
  </div>

  <!-- МЕНЮ -->
  <div class="screen" id="screenMenu">
    <div class="nav-bar">
      <button class="nav-btn" onclick="goBackToTopics()">← К темам</button>
      <span class="nav-title" id="menuTitle"></span>
    </div>
    <div class="stats-row" id="allTimeStats"></div>
    <div class="menu" id="menuGrid"></div>
  </div>

  <!-- ТРЕНИРОВКА -->
  <div class="screen" id="screenTrain">
    <div class="nav-bar">
      <button class="nav-btn" onclick="confirmQuit()">← Меню</button>
      <span class="nav-title" id="navTrainTitle">Тема</span>
    </div>
    <div class="stats-row">
      <div class="stat-box green"><div class="stat-val" id="statOk">0</div><div class="stat-label">Верно</div></div>
      <div class="stat-box red"><div class="stat-val" id="statFail">0</div><div class="stat-label">Ошибки</div></div>
      <div class="stat-box"><div class="stat-val" id="statTimer">0:00</div><div class="stat-label">Время</div></div>
    </div>
    <div class="progress-wrap"><div class="progress-fill" id="progressBar" style="width:0%">0%</div></div>
    <div class="ex-card">
      <div class="ex-label" id="exLabel">Тема</div>
      <div class="ex-progress" id="exProgress">1 из 5</div>
      <div class="timer" id="qTimer"></div>
      <div class="ex-task" id="exTask"></div>
      <div class="options" id="optionsGrid"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>

  <!-- РЕЗУЛЬТАТ -->
  <div class="screen" id="screenResult">
    <div class="result-card">
      <h2 id="resultTitle">Результаты</h2>
      <div class="result-big" id="resultScore"></div>
      <div class="result-msg" id="resultMsg"></div>
      <div class="stats-row" id="resultStats"></div>
      <button class="btn-back" onclick="goMenu()">← В меню</button>
    </div>
  </div>

  <!-- СПИСОК ДОМАШНИХ ЗАДАНИЙ -->
  <div class="screen" id="screenHWList">
    <div class="nav-bar">
      <button class="nav-btn" onclick="goTopics()">← Назад</button>
      <div class="nav-title">Домашние задания</div>
    </div>
    <div class="grid" id="hwGrid"></div>
  </div>

  <!-- ДОМАШНЕЕ ЗАДАНИЕ -->
  <div class="screen" id="screenHomework">
    <div class="nav-bar">
      <button class="nav-btn" onclick="openHWList()">← К списку ДЗ</button>
      <div class="nav-title">Домашнее задание</div>
      <button class="nav-btn" id="hwDocxBtn" onclick="downloadHWDocx()">⬇️ Скачать .docx</button>
    </div>
    <div class="homework-content" id="homeworkContent"></div>
  </div>
</div>

<div class="confetti-box" id="confettiBox"></div>

<script>
// ===== THEME =====
function toggleTheme(){const h=document.documentElement;const d=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',d?'':'dark');localStorage.setItem('theme',d?'light':'dark')}
(function(){if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')})();

// ===== ВЫБОР ТЕМЫ =====
let currentTopic='';
const TOPICS=[
  {id:'phenomena',label:'Физические явления',icon:'⚛️',desc:'Механические, тепловые, электрические, магнитные, световые и звуковые явления'},
  {id:'measure',label:'Физические величины и их измерение',icon:'📏',desc:'Длина, масса, время, температура, скорость, приборы измерения'},
  {id:'temp',label:'Измерение температуры (Урок 4)',icon:'🌡️',desc:'Термометры, шкала Цельсия, цена деления, датчики температуры'},
  {id:'tech',label:'Физика и техника (Урок 6)',icon:'🚀',desc:'Вклад великих учёных, физика и техника, достижения отечественной космонавтики'},
  {id:'matter',label:'Строение вещества (Урок 7)',icon:'⚛️',desc:'Гипотеза Демокрита, атомы и молекулы, опыты о строении вещества, промежутки между частицами'},
  {id:'molecules',label:'Молекулы (Урок 8)',icon:'🔬',desc:'Молекула вещества, строение молекул, озон, вещества без молекул, размеры молекул'}
];
function goTopics(){showScreen('screenTopics');renderTopics()}
function renderTopics(){
  const g=document.getElementById('topicGrid');g.innerHTML='';
  let totalOk=0,totalAll=0;
  TOPICS.forEach(t=>{
    const s=JSON.parse(localStorage.getItem('physStats_'+t.id)||'{}');
    Object.values(s).forEach(v=>{totalOk+=v.ok;totalAll+=v.ok+v.fail});
  });
  document.getElementById('topicStats').innerHTML=`
    <div class="stat-box green"><div class="stat-val">${totalOk}</div><div class="stat-label">Всего верно</div></div>
    <div class="stat-box"><div class="stat-val">${totalAll}</div><div class="stat-label">Всего решено</div></div>`;
  TOPICS.forEach(t=>{
    const card=document.createElement('div');card.className='topic-card';
    card.innerHTML=`<div class="tc-icon">${t.icon}</div><div class="tc-title">${t.label}</div><div class="tc-desc">${t.desc}</div>`;
    card.onclick=()=>selectTopic(t.id);
    g.appendChild(card);
  });
}
function selectTopic(id){currentTopic=id;goMenu()}
function goBackToTopics(){currentTopic='';showScreen('screenTopics');renderTopics()}

// ===== ДОМАШНЕЕ ЗАДАНИЕ =====
const HOMEWORK={};
HOMEWORK.measure=`<div class="hw-card">
  <div class="hw-title">📚 Домашняя работа (Урок 3)</div>
  <h3>1. Повтори теорию</h3>
  <ul>
    <li>Какие физические величины мы измеряли в этом уроке?</li>
    <li>В каких единицах измеряют длину, массу, время и температуру?</li>
    <li>Какие приборы измеряют длину, массу, время и температуру?</li>
    <li>Что такое цена деления шкалы прибора?</li>
    <li>Как перевести миллиметры в сантиметры и метры, а часы в минуты?</li>
  </ul>
</div>
<div class="hw-card">
  <h3>2. Отработай в тренажёре</h3>
  <div class="hw-sub">Пройди «Микс», «Правда или ложь» и «Найди лишнее» по теме «Физические величины и их измерение». Добейся не менее 70% в каждом режиме.</div>
</div>
<div class="hw-card">
  <h3>3. Ответь письменно</h3>
  <div class="hw-sub"><strong>1.</strong> Заполните пропуски, переведя единицы длины:</div>
  <table class="hw-table">
    <tr><th>Физическое тело</th><th>мм</th><th>см</th><th>м</th><th>км</th></tr>
    <tr><td>Диаметр монеты 10 р.</td><td>22</td><td>?</td><td>?</td><td>?</td></tr>
    <tr><td>Высота листа А4</td><td>?</td><td>30</td><td>?</td><td>?</td></tr>
    <tr><td>Высота здания</td><td>?</td><td>?</td><td>35</td><td>?</td></tr>
  </table>
  <div class="hw-sub"><strong>2.</strong> Сравните, что больше: 40 мин или ¾ ч? Переведите 2500 м в километры и 180 с в минуты.</div>
</div>`;
HOMEWORK.temp=`<div class="hw-card">
  <div class="hw-title">📚 Домашняя работа (Урок 4)</div>
  <h3>1. Повтори теорию</h3>

// ===== ЭКСПОРТ ДОМАШНЕГО ЗАДАНИЯ В .DOCX =====
const DW_BLOCK=new Set(['div','p','section','article','blockquote','pre','ul','ol','table','h1','h2','h3','h4','h5','h6','li']);
function dwEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function dwRuns(nodes,st,out){
  for(const n of nodes){
    if(n.nodeType===3){if(n.nodeValue)out.push({t:n.nodeValue.replace(/\s+/g,' '),s:st});continue}
    if(n.nodeType!==1)continue;
    const tag=n.tagName.toLowerCase();
    if(tag==='br'){out.push({br:1});continue}
    if(DW_BLOCK.has(tag))continue;
    if(tag==='strong'||tag==='b'){dwRuns(n.childNodes,Object.assign({},st,{b:1}),out);continue}
    if(tag==='em'||tag==='i'){dwRuns(n.childNodes,Object.assign({},st,{i:1}),out);continue}
    if(tag==='u'){dwRuns(n.childNodes,Object.assign({},st,{u:1}),out);continue}
    dwRuns(n.childNodes,st,out);
  }
  return out;
}
function dwInline(node){return dwRuns(node.childNodes,{},[])}
function dwPara(runs,opts){
  opts=opts||{};
  const pPr=[];
  if(opts.style)pPr.push('<w:pStyle w:val="'+opts.style+'"/>');
  if(opts.space)pPr.push('<w:spacing w:before="180" w:after="60"/>');
  if(opts.list)pPr.push('<w:ind w:left="360" w:hanging="0"/>');
  if(opts.align)pPr.push('<w:jc w:val="'+opts.align+'"/>');
  let body='';
  if(opts.prefix)body+='<w:r><w:t xml:space="preserve">'+dwEsc(opts.prefix)+'</w:t></w:r>';
  for(const r of runs){
    if(r.br){body+='<w:r><w:br/></w:r>';continue}
    const b=r.s&&r.s.b?'<w:b/>':'',it=r.s&&r.s.i?'<w:i/>':'',u=r.s&&r.s.u?'<w:u w:val="single"/>':'';
    body+='<w:r>'+((b||it||u)?'<w:rPr>'+b+it+u+'</w:rPr>':'')+'<w:t xml:space="preserve">'+dwEsc(r.t)+'</w:t></w:r>';
  }
  return '<w:p>'+(pPr.length?'<w:pPr>'+pPr.join('')+'</w:pPr>':'')+body+'</w:p>';
}
function dwList(node,out,ordered){
  let i=1;
  for(const n of node.children){
    if(n.tagName.toLowerCase()!=='li')continue;
    out.push(dwPara(dwInline(n),{list:true,prefix:(ordered?i+'.  ':'•  ')}));
    i++;
  }
}
function dwTable(node,out){
  const trs=[...node.querySelectorAll('tr')].filter(tr=>tr.closest('table')===node);
  if(!trs.length)return;
  let cols=1;
  trs.forEach(tr=>{cols=Math.max(cols,[...tr.children].filter(c=>/^(TD|TH)$/.test(c.tagName)).length)});
  const edges=['top','left','bottom','right','insideH','insideV'].map(s=>'<w:'+s+' w:val="single" w:sz="6" w:space="0" w:color="9CA3AF"/>').join('');
  let xml='<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>'+edges+'</w:tblBorders></w:tblPr>';
  trs.forEach(tr=>{
    xml+='<w:tr>';
    [...tr.children].filter(c=>/^(TD|TH)$/.test(c.tagName)).forEach(c=>{
      const head=/^TH$/.test(c.tagName);
      const runs=dwInline(c);
      if(head)runs.forEach(r=>{r.s=Object.assign({},r.s,{b:1})});
      xml+='<w:tc><w:tcPr><w:tcW w:w="'+Math.floor(5000/cols)+'" w:type="pct"/>'+(head?'<w:shd w:val="clear" w:fill="DBEAFE"/>':'')+'<w:vAlign w:val="center"/></w:tcPr>'+dwPara(runs,{align:'center'})+'</w:tc>';
    });
    xml+='</w:tr>';
  });
  out.push(xml+'</w:tbl><w:p/>');
}
function dwBlocks(node,out,heading){
  let runs=[];
  const flush=()=>{
    const txt=runs.map(r=>r.br?'':(r.t||'')).join('').replace(/[\u00a0]/g,' ').trim();
    if(txt)out.push(dwPara(runs,{style:heading?'Heading'+Math.min(heading,4):'',space:!!heading}));
    runs=[];
  };
  for(const n of node.childNodes){
    if(n.nodeType===3){runs.push({t:n.nodeValue.replace(/\s+/g,' ')});continue}
    if(n.nodeType!==1)continue;
    const tag=n.tagName.toLowerCase();
    if(tag==='table'){flush();dwTable(n,out);continue}
    if(tag==='ul'||tag==='ol'){flush();dwList(n,out,tag==='ol');continue}
    if(/^h[1-6]$/.test(tag)){flush();out.push(dwPara(dwInline(n),{style:'Heading'+tag[1],space:true}));continue}
    if(DW_BLOCK.has(tag)){
      let h=heading||0;
      if(tag==='div'&&n.classList.contains('hw-title'))h=1;
      flush();dwBlocks(n,out,h);continue;
    }
    runs=runs.concat(dwInline(n));
  }
  flush();
}
function dwHead(s){return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+s}
const DW_STYLES=dwHead('<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'+
 '<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/><w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="ru-RU"/></w:rPr></w:rPrDefault>'+
 '<w:pPrDefault><w:pPr><w:spacing w:after="120" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>'+
 '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>'+
 [1,2,3,4].map(i=>'<w:style w:type="paragraph" w:styleId="Heading'+i+'"><w:name w:val="heading '+i+'"/><w:basedOn w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="240" w:after="120"/><w:outlineLvl w:val="'+(i-1)+'"/></w:pPr><w:rPr><w:b/><w:sz w:val="'+(34-i*2)+'"/><w:color w:val="1D4ED8"/></w:rPr></w:style>').join('')+
 '</w:styles>');
function dwCrc32(buf){
  let c=~0;
  for(let i=0;i<buf.length;i++){
    c^=buf[i];
    for(let k=0;k<8;k++)c=(c>>>1)^(0xEDB88320&-(c&1));
  }
  return ~c>>>0;
}
function dwZip(files){
  const enc=new TextEncoder(),chunks=[],cdir=[];
  let off=0,total=0;
  for(const f of files){
    const name=enc.encode(f.name),data=enc.encode(f.data),crc=dwCrc32(data),size=data.length;
    const lh=new Uint8Array(30+name.length),dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0x0800,true);
    dv.setUint16(8,0,true);dv.setUint16(10,0,true);dv.setUint16(12,0x2100,true);
    dv.setUint32(14,crc,true);dv.setUint32(18,size,true);dv.setUint32(22,size,true);
    dv.setUint16(26,name.length,true);dv.setUint16(28,0,true);
    lh.set(name,30);
    chunks.push(lh,data);
    const ch=new Uint8Array(46+name.length),cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true);cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint16(14,0x2100,true);
    cv.setUint32(16,crc,true);cv.setUint32(20,size,true);cv.setUint32(24,size,true);
    cv.setUint16(28,name.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);
    cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,off,true);
    ch.set(name,46);
    cdir.push(ch);
    off+=lh.length+size;total++;
  }
  const cdSize=cdir.reduce((a,b)=>a+b.length,0);
  const eocd=new Uint8Array(22),ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);
  ev.setUint16(8,total,true);ev.setUint16(10,total,true);
  ev.setUint32(12,cdSize,true);ev.setUint32(16,off,true);ev.setUint16(20,0,true);
  return new Blob([...chunks,...cdir,eocd],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffleAnswers(q){
  const indices=[0,1,2,3];
  shuffle(indices);
  const newA=indices.map(i=>q.a[i]);
  const newC=indices.indexOf(q.c);
  return{...q,a:newA,c:newC};
}

  {items:['💨 Гелий','🧊 Кремний','☠️ Мышьяк','🌊 Вода'],c:3,note:'Вода состоит из молекул H₂O, остальные вещества — из атомов!'},
  {items:['🔬 Туннельный микроскоп','🔬 Электронный микроскоп','🔬 Оптический микроскоп','🔬 Люстра'],c:3,note:'Люстра — светильник, а настоящие микроскопы позволили увидеть атомы и молекулы!'},
  {items:['🧪 Озон','💧 Водяной пар','❄️ Лёд','🛡️ Слой озона'],c:2,note:'Лёд — не новое вещество, а твёрдое состояние воды, тогда как озон — новое вещество!'},
  {items:['📏 Метод масляных плёнок','🔭 Метод измерения расстояний до звёзд','🧮 Метод угадывания','🎲 Метод случайного выбора'],c:3,note:'Угадывание и случайный выбор не имеют отношения к оценке размеров молекул!'},
  {items:['CO₂','H₂O','O₂','O₃'],c:0,note:'В молекуле CO₂ два атома кислорода и один атом углерода, а не три атома кислорода!'},
  {items:['⚛️ Атом водорода','🔬 Молекула водорода H₂','💧 Молекула воды','🟢 Атом кислорода'],c:0,note:'В природе водород существует в виде двухатомных молекул H₂, поэтому одиночного атома водорода как частицы вещества нет!'}
];

// ===== МЕХАНИКА =====
let state={mode:'',total:5,current:0,ok:0,fail:0,answers:[],startTime:0,timerInterval:null};
let currentQ=null,selectedIdx=-1;

// ===== ТАЙМЕР ВОПРОСА (5 секунд) =====
const Q_TIME=5;
let qTimeLeft=Q_TIME,qTimerInt=null,qMode='mix',qAdvanceT=null;
function startQTimer(){
  clearInterval(qTimerInt);
  qTimeLeft=Q_TIME;
  const el=document.getElementById('qTimer');
  if(!el)return;
  el.textContent='⏱ '+qTimeLeft+' сек';
  el.classList.remove('low');
  qTimerInt=setInterval(()=>{
    qTimeLeft--;
    if(qTimeLeft<0){clearInterval(qTimerInt);return}
    el.textContent='⏱ '+qTimeLeft+' сек';
    el.classList.toggle('low',qTimeLeft<=2);
    if(qTimeLeft===0){clearInterval(qTimerInt);onTimeUp()}
  },1000);
}
function stopQTimer(){
  clearInterval(qTimerInt);qTimerInt=null;
  const el=document.getElementById('qTimer');
  if(el)el.textContent='';
}
function scheduleAdvance(fn,delay){clearTimeout(qAdvanceT);qAdvanceT=setTimeout(fn,delay)}
function updateRoundBar(done,total){
  const pct=Math.round((done/total)*100);
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('progressBar').textContent=pct+'%';
}
function onTimeUp(){
  if(qMode==='mix')timeUpMix();
  else if(qMode==='odd')timeUpOdd();
  else timeUpTF();
}
function timeUpMix(){
  if(selectedIdx!==-1)return;
  const opts=document.querySelectorAll('#optionsGrid .opt-btn');
  const q=state.answers[state.current];
  opts.forEach(b=>b.disabled=true);
  state.fail++;
  opts.forEach((b,i)=>{if(i===q.c)b.classList.add('correct')});
  const fb=document.getElementById('feedback');
  fb.className='feedback show fail';
  fb.textContent='⏰ Время вышло! Правильный ответ: '+q.a[q.c];
document.getElementById('statFail').textContent=state.fail;
  scheduleAdvance(()=>{state.current++;nextExercise()},1200);
}
let oddRndC=0;
function timeUpOdd(){
  if(oddLocked)return;oddLocked=true;
  const cards=document.querySelectorAll('#optionsGrid .odd-card');
  cards.forEach(b=>b.disabled=true);
  cards[oddRndC].classList.add('correct');
  const fb=document.getElementById('feedback');
  fb.className='feedback show fail';
  fb.textContent='⏰ Время вышло! '+oddDeck[oddIdx-1].note;
  oddFail++;
  document.getElementById('statFail').textContent=oddFail;
  updateRoundBar(oddIdx,oddDeck.length);
  const stats=JSON.parse(localStorage.getItem('physStats_'+currentTopic)||'{}');if(!stats.odd)stats.odd={ok:0,fail:0};stats.odd.fail++;localStorage.setItem('physStats_'+currentTopic,JSON.stringify(stats));
  scheduleAdvance(()=>showOddRound(),2000);
}
function timeUpTF(){
  if(tfLocked)return;tfLocked=true;
  const r=tfDeck[tfIdx-1];
  const btns=document.querySelectorAll('#optionsGrid .opt-btn');
  btns.forEach(b=>b.disabled=true);
  btns[r.a?0:1].classList.add('correct');
  const fb=document.getElementById('feedback');
  fb.className='feedback show fail';
  fb.textContent='⏰ Время вышло! '+r.e;
  tfFail++;
  document.getElementById('statFail').textContent=tfFail;
  updateRoundBar(tfIdx,tfDeck.length);
  const stats=JSON.parse(localStorage.getItem('physStats_'+currentTopic)||'{}');if(!stats.tf)stats.tf={ok:0,fail:0};stats.tf.fail++;localStorage.setItem('physStats_'+currentTopic,JSON.stringify(stats));
  scheduleAdvance(()=>showTFRound(),2000);
}

function renderMenu(){
  const g=document.getElementById('menuGrid');g.innerHTML='';
  const stats=JSON.parse(localStorage.getItem('physStats_'+currentTopic)||'{}');
  let totalOk=0,totalAll=0;
  Object.values(stats).forEach(s=>{totalOk+=s.ok;totalAll+=s.ok+s.fail});
  document.getElementById('allTimeStats').innerHTML=`
    <div class="stat-box green"><div class="stat-val">${totalOk}</div><div class="stat-label">Всего верно</div></div>
    <div class="stat-box"><div class="stat-val">${totalAll}</div><div class="stat-label">Всего решено</div></div>`;
  const topic=TOPICS.find(t=>t.id===currentTopic);
  document.getElementById('menuTitle').textContent=topic?topic.icon+' '+topic.label:'';

  const menuData=getMenuForTopic(currentTopic);
  menuData.forEach(gr=>{
    const s=stats[gr.id];const cnt=s?s.ok+s.fail:0;
    const grp=document.createElement('div');grp.className='menu-group';
    grp.innerHTML=`<div class="menu-group-header" data-mode="${gr.id}"><span class="gh-icon">${gr.icon}</span><span class="gh-label">${gr.label}</span><span class="mi-count" style="margin-left:auto;font-size:.75rem;color:var(--text-secondary)">${cnt?cnt+' реш.':gr.hint}</span></div>`;
    grp.querySelector('.menu-group-header').onclick=()=>startMode(gr.id);
    g.appendChild(grp);
  });
}
function getMenuForTopic(topic){
  return[{id:'mix',label:'Микс (все темы)',icon:'🎲',hint:'10 вопросов'},{id:'odd',label:'Найди лишнее',icon:'🕵️',hint:'10 раундов'},{id:'tf',label:'Правда или ложь',icon:'⚖️',hint:'10 вопросов'}];
}

function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));const el=document.getElementById(id);if(el)el.classList.add('active')}
function goMenu(){clearTimeout(qAdvanceT);stopQTimer();showScreen('screenMenu');renderMenu()}
function confirmQuit(){if(state.current>0&&state.current<state.total){if(!confirm('Тренировка не завершена. Выйти в меню?'))return;clearInterval(state.timerInterval)}goMenu()}

function startMode(id){
  if(id==='odd'){startOddGame();return}
  if(id==='tf'){startTFGame();return}
  let questions=[];
  if(currentTopic==='phenomena'){
    if(id==='mix'){
      const types=['mech','thermal','electric','magnetic','light','sound'];
      types.forEach(t=>{QUESTIONS[t].forEach((q)=>questions.push(shuffleAnswers({...q,type:t})))});
      shuffle(questions);questions=questions.slice(0,10);
    }else if(QUESTIONS[id]){
      QUESTIONS[id].forEach((q)=>questions.push(shuffleAnswers({...q,type:id})));
    }
  }else if(currentTopic==='measure'){
    if(id==='mix'){
      QUESTIONS2.forEach((q)=>questions.push(shuffleAnswers({...q})));
      shuffle(questions);questions=questions.slice(0,10);
    }
  }else if(currentTopic==='temp'){
    if(id==='mix'){
      QUESTIONS3.forEach((q)=>questions.push(shuffleAnswers({...q})));
      shuffle(questions);questions=questions.slice(0,10);
    }
  }else if(currentTopic==='tech'){
    if(id==='mix'){
      QUESTIONS5.forEach((q)=>questions.push(shuffleAnswers({...q})));
      shuffle(questions);questions=questions.slice(0,10);
    }
  }else if(currentTopic==='matter'){
    if(id==='mix'){
      QUESTIONS6.forEach((q)=>questions.push(shuffleAnswers({...q})));
      shuffle(questions);questions=questions.slice(0,10);
    }
  }else if(currentTopic==='molecules'){
    if(id==='mix'){
      QUESTIONS7.forEach((q)=>questions.push(shuffleAnswers({...q})));
      shuffle(questions);questions=questions.slice(0,10);
    }
  }
  if(!questions.length){alert('Нет вопросов');return}

  const t=TYPES.find(x=>x.id===id);
  qMode='mix';
  clearTimeout(qAdvanceT);stopQTimer();
  state={mode:id,total:questions.length,current:0,ok:0,fail:0,answers:questions,startTime:Date.now(),timerInterval:null};
  document.getElementById('statOk').textContent='0';document.getElementById('statFail').textContent='0';
  document.getElementById('navTrainTitle').textContent=t?t.name:id==='mix'?'Микс':'Тема';
  showScreen('screenTrain');startTimer();nextExercise();
}

function startTimer(){
  clearInterval(state.timerInterval);
  state.timerInterval=setInterval(()=>{
    const sec=Math.floor((Date.now()-state.startTime)/1000);
    const m=Math.floor(sec/60),s=sec%60;
    document.getElementById('statTimer').textContent=m+':'+String(s).padStart(2,'0');
  },1000);
}

function nextExercise(){
  if(state.current>=state.total){finish();return}
  selectedIdx=-1;
  const fb=document.getElementById('feedback');fb.className='feedback';fb.textContent='';
  document.getElementById('exProgress').textContent=(state.current+1)+' из '+state.total;
  const pct=Math.round((state.current/state.total)*100);
  document.getElementById('progressBar').style.width=pct+'%';document.getElementById('progressBar').textContent=pct+'%';

  currentQ=state.answers[state.current];
  document.getElementById('exLabel').textContent=currentQ.type?TYPES.find(t=>t.id===currentQ.type)?.name||'':'Вопрос';
  document.getElementById('exTask').textContent=currentQ.q;

  const grid=document.getElementById('optionsGrid');grid.innerHTML='';
  currentQ.a.forEach((val,i)=>{
    const b=document.createElement('button');b.className='opt-btn';b.textContent=val;
    b.onclick=()=>selectOption(i,val);grid.appendChild(b);
  });
  startQTimer();
}

function selectOption(idx,val){
  selectedIdx=idx;
  document.querySelectorAll('.opt-btn').forEach((b,i)=>{b.classList.remove('selected');if(i===idx)b.classList.add('selected')});
  submitAnswer();
}

function submitAnswer(){
  if(selectedIdx===-1)return;
  stopQTimer();
  const fb=document.getElementById('feedback');const opts=document.querySelectorAll('.opt-btn');
  opts.forEach(b=>b.disabled=true);
  const isCorrect=selectedIdx===currentQ.c;
  if(isCorrect){
    state.ok++;opts[selectedIdx].classList.add('correct');fb.className='feedback show ok';fb.textContent='✅ Верно!';
  }else{
    state.fail++;opts[selectedIdx].classList.add('wrong');
    opts.forEach((b,i)=>{if(i===currentQ.c)b.classList.add('correct')});
    fb.className='feedback show fail';fb.textContent='❌ Неверно. Правильный ответ: '+currentQ.a[currentQ.c];
  }
  document.getElementById('statOk').textContent=state.ok;document.getElementById('statFail').textContent=state.fail;
  scheduleAdvance(()=>{state.current++;nextExercise()},1200);
}

function finish(){
  clearInterval(state.timerInterval);
  stopQTimer();
  const sec=Math.floor((Date.now()-state.startTime)/1000);const m=Math.floor(sec/60),s=sec%60;
  const pct=Math.round((state.ok/state.total)*100);
  let cls='red',msg='Нужно подтянуть :(',grade=2;
  if(pct>=85){cls='green';msg='Отлично! 🎉';grade=5}
  else if(pct>=70){cls='green';msg='Хорошо!';grade=4}
  else if(pct>=50){cls='yellow';msg='Неплохо';grade=3}
  document.getElementById('resultTitle').textContent='Результаты — Ученик';
  document.getElementById('resultScore').className='result-big '+cls;document.getElementById('resultScore').textContent=pct+'% — оценка '+grade;
  document.getElementById('resultMsg').textContent=msg;
  document.getElementById('resultStats').innerHTML=`
    <div class="stat-box green"><div class="stat-val">${state.ok}</div><div class="stat-label">Верно</div></div>
    <div class="stat-box red"><div class="stat-val">${state.fail}</div><div class="stat-label">Ошибки</div></div>
    <div class="stat-box"><div class="stat-val">${m}:${String(s).padStart(2,'0')}</div><div class="stat-label">Время</div></div>`;
  const stats=JSON.parse(localStorage.getItem('physStats_'+currentTopic)||'{}');
  if(!stats[state.mode])stats[state.mode]={ok:0,fail:0};
  stats[state.mode].ok+=state.ok;stats[state.mode].fail+=state.fail;
  localStorage.setItem('physStats_'+currentTopic,JSON.stringify(stats));
  showScreen('screenResult');if(pct>=85)launchConfetti();
}

function finishRoundGame(title){
  stopQTimer();
  const isOdd=qMode==='odd';
  qMode='';
  const ok=isOdd?oddOk:tfOk,fail=isOdd?oddFail:tfFail;
  const total=ok+fail;
  const sec=Math.floor((Date.now()-(isOdd?oddStart:tfStart))/1000);const m=Math.floor(sec/60),s=sec%60;
  const pct=total?Math.round((ok/total)*100):0;
  let cls='red',msg='Нужно подтянуть :(',grade=2;
  if(pct>=85){cls='green';msg='Отлично! 🎉';grade=5}
  else if(pct>=70){cls='green';msg='Хорошо!';grade=4}
  else if(pct>=50){cls='yellow';msg='Неплохо';grade=3}
  document.getElementById('resultTitle').textContent=title+' — Ученик';
  document.getElementById('resultScore').className='result-big '+cls;document.getElementById('resultScore').textContent=pct+'% — оценка '+grade;
  document.getElementById('resultMsg').textContent=msg;
  document.getElementById('resultStats').innerHTML=`
    <div class="stat-box green"><div class="stat-val">${ok}</div><div class="stat-label">Верно</div></div>
    <div class="stat-box red"><div class="stat-val">${fail}</div><div class="stat-label">Ошибки</div></div>
    <div class="stat-box"><div class="stat-val">${m}:${String(s).padStart(2,'0')}</div><div class="stat-label">Время</div></div>`;
  showScreen('screenResult');if(pct>=85)launchConfetti();
}

function launchConfetti(){
  const c=document.getElementById('confettiBox');const colors=['#3b82f6','#f97316','#22c55e','#ef4444','#eab308','#8b5cf6','#ec4899'];
  for(let i=0;i<50;i++){const p=document.createElement('div');p.className='confetti-p';p.style.left=Math.random()*100+'%';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.width=(Math.random()*6+4)+'px';p.style.height=(Math.random()*6+4)+'px';p.style.borderRadius=Math.random()>.5?'50%':'2px';p.style.animationDuration=(Math.random()*2+1.5)+'s';p.style.animationDelay=(Math.random()*1)+'s';c.appendChild(p)}
  setTimeout(()=>c.innerHTML='',4000);
}

// ===== ИГРА «НАЙДИ ЛИШНЕЕ» =====
let oddDeck=[],oddIdx=0,oddLocked=false,oddOk=0,oddFail=0,oddStart=0;
const ROUND_TOTAL=10;
function startOddGame(){
  qMode='odd';clearTimeout(qAdvanceT);stopQTimer();
  let deck=ODD_ROUNDS;
  if(currentTopic==='measure')deck=ODD_ROUNDS2;
  if(currentTopic==='temp')deck=ODD_ROUNDS3;
  if(currentTopic==='tech')deck=ODD_ROUNDS5;
  if(currentTopic==='matter')deck=ODD_ROUNDS6;
  if(currentTopic==='molecules')deck=ODD_ROUNDS7;
  oddDeck=shuffle([...deck]).slice(0,ROUND_TOTAL);oddIdx=0;oddOk=0;oddFail=0;oddStart=Date.now();
  document.getElementById('statOk').textContent='0';document.getElementById('statFail').textContent='0';
  showOddRound()
}
function showOddRound(){
  if(qMode!=='odd')return;
  if(oddIdx>=oddDeck.length){finishRoundGame('Найди лишнее');return}
  const r=oddDeck[oddIdx];oddIdx++;
  const order=[0,1,2,3];shuffle(order);
  const rndC=order.indexOf(r.c);
  oddRndC=rndC;
  showScreen('screenTrain');
  document.getElementById('navTrainTitle').textContent='🕵️ Найди лишнее';
  document.getElementById('exLabel').textContent=currentTopic==='measure'?'Какой объект лишний?':(currentTopic==='matter'||currentTopic==='molecules')?'Что лишнее?':'Какое явление лишнее?';
  document.getElementById('exProgress').textContent=oddIdx+' из '+oddDeck.length;
  const pct=Math.round(((oddIdx-1)/oddDeck.length)*100);
  document.getElementById('progressBar').style.width=pct+'%';document.getElementById('progressBar').textContent=pct+'%';
  const grid=document.getElementById('optionsGrid');grid.innerHTML='';grid.className='odd-grid';
  document.getElementById('exTask').textContent=currentTopic==='measure'?'Нажми на лишний объект':(currentTopic==='matter'||currentTopic==='molecules')?'Нажми на лишний элемент':'Нажми на лишнее явление';
  document.getElementById('feedback').className='feedback';document.getElementById('feedback').textContent='';
  order.forEach((orig,i)=>{
    const b=document.createElement('button');b.className='odd-card';b.textContent=r.items[orig];
    b.onclick=()=>handleOddPick(i,b,r,rndC);grid.appendChild(b);
  });
  oddLocked=false;
  startQTimer();
}
function handleOddPick(i,btn,r,rndC){
  if(oddLocked)return;oddLocked=true;stopQTimer();
  const grid=document.getElementById('optionsGrid');
  grid.querySelectorAll('.odd-card').forEach(b=>b.disabled=true);
  const fb=document.getElementById('feedback');
  if(i===rndC){oddOk++;btn.classList.add('correct');fb.className='feedback show ok';fb.textContent='✅ Верно! '+r.note;
    const stats=JSON.parse(localStorage.getItem('physStats_'+currentTopic)||'{}');if(!stats.odd)stats.odd={ok:0,fail:0};stats.odd.ok++;localStorage.setItem('physStats_'+currentTopic,JSON.stringify(stats));
  }else{oddFail++;btn.classList.add('wrong');grid.querySelectorAll('.odd-card')[rndC].classList.add('odd-out');fb.className='feedback show fail';fb.textContent='🤔 '+r.note;
    const stats=JSON.parse(localStorage.getItem('physStats_'+currentTopic)||'{}');if(!stats.odd)stats.odd={ok:0,fail:0};stats.odd.fail++;localStorage.setItem('physStats_'+currentTopic,JSON.stringify(stats));
  }
  document.getElementById('statOk').textContent=oddOk;document.getElementById('statFail').textContent=oddFail;
  updateRoundBar(oddIdx,oddDeck.length);
  scheduleAdvance(()=>showOddRound(),2500);
}

// ===== ИГРА «ПРАВДА ИЛИ ЛОЖЬ» =====
let tfDeck=[],tfIdx=0,tfLocked=false,tfOk=0,tfFail=0,tfStart=0;
function startTFGame(){
  qMode='tf';clearTimeout(qAdvanceT);stopQTimer();
  let deck=TRUE_FALSE;
  if(currentTopic==='measure')deck=TRUE_FALSE2;
  if(currentTopic==='temp')deck=TRUE_FALSE3;
  if(currentTopic==='tech')deck=TRUE_FALSE5;
  if(currentTopic==='matter')deck=TRUE_FALSE6;
  if(currentTopic==='molecules')deck=TRUE_FALSE7;
  tfDeck=shuffle([...deck]).slice(0,ROUND_TOTAL);tfIdx=0;tfOk=0;tfFail=0;tfStart=Date.now();
  document.getElementById('statOk').textContent='0';document.getElementById('statFail').textContent='0';
  showTFRound()
}
function showTFRound(){
  if(qMode!=='tf')return;
  if(tfIdx>=tfDeck.length){finishRoundGame('Правда или ложь');return}
  const r=tfDeck[tfIdx];tfIdx++;
  showScreen('screenTrain');
  document.getElementById('navTrainTitle').textContent='⚖️ Правда или ложь?';
  document.getElementById('exLabel').textContent='Верное ли утверждение?';
  document.getElementById('exProgress').textContent=tfIdx+' из '+tfDeck.length;
  const pct=Math.round(((tfIdx-1)/tfDeck.length)*100);
  document.getElementById('progressBar').style.width=pct+'%';document.getElementById('progressBar').textContent=pct+'%';
  document.getElementById('exTask').textContent=r.q;
  document.getElementById('optionsGrid').className='options';
  const grid=document.getElementById('optionsGrid');grid.innerHTML='';
  const b1=document.createElement('button');b1.className='opt-btn';b1.textContent='✅ Верно';
  const b2=document.createElement('button');b2.className='opt-btn';b2.textContent='❌ Неверно';
  b1.onclick=()=>handleTFPick(true,b1,b2,r);b2.onclick=()=>handleTFPick(false,b1,b2,r);
  grid.appendChild(b1);grid.appendChild(b2);
  document.getElementById('feedback').className='feedback';document.getElementById('feedback').textContent='';
  tfLocked=false;
  startQTimer();
}
function handleTFPick(pick,b1,b2,r){
  if(tfLocked)return;tfLocked=true;stopQTimer();b1.disabled=true;b2.disabled=true;
  const fb=document.getElementById('feedback');
  const correct=pick===r.a;
  if(correct){tfOk++;(pick?b1:b2).classList.add('correct');fb.className='feedback show ok';fb.textContent='✅ '+r.e;
    const stats=JSON.parse(localStorage.getItem('physStats_'+currentTopic)||'{}');if(!stats.tf)stats.tf={ok:0,fail:0};stats.tf.ok++;localStorage.setItem('physStats_'+currentTopic,JSON.stringify(stats));
  }else{tfFail++;(pick?b1:b2).classList.add('wrong');(r.a?b1:b2).classList.add('correct');fb.className='feedback show fail';fb.textContent='❌ '+r.e;
    const stats=JSON.parse(localStorage.getItem('physStats_'+currentTopic)||'{}');if(!stats.tf)stats.tf={ok:0,fail:0};stats.tf.fail++;localStorage.setItem('physStats_'+currentTopic,JSON.stringify(stats));
  }
  document.getElementById('statOk').textContent=tfOk;document.getElementById('statFail').textContent=tfFail;
  updateRoundBar(tfIdx,tfDeck.length);
  scheduleAdvance(()=>showTFRound(),2200);
}

// ===== KEYBOARD =====
document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)&&document.getElementById('screenTrain').classList.contains('active')){
    const idx=parseInt(e.key)-1;const opts=document.querySelectorAll('.opt-btn');if(opts[idx]&&!opts[idx].disabled)opts[idx].click();
  }
});

goTopics();
